<!DOCTYPE html>
<html>
<head><title>TradingView Test</title></head>
<body>
  <div class='tradingview-widget-container' style='height:500px;width:800px'>
    <div id='tv_chart_test'></div>
    <script type='text/javascript' src='https://s3.tradingview.com/tv.js'></script>
    <script type='text/javascript'>
      window.onload = function() {
        new TradingView.widget({
          autosize: true,
          symbol: 'NSE:VTL',
          interval: 'D',
          timezone: 'Asia/Kolkata',
          theme: 'dark',
          style: '1',
          locale: 'en',
          container_id: 'tv_chart_test'
        });
      }
    </script>
  </div>
</body>
</html>
